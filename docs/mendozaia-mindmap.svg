<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Mendoza IA mind map</title>
  <desc id="desc">Mind map do fluxo principal do projeto Mendoza IA, cobrindo canais, persistencia, debounce, engine, orquestrador, memoria e operacao.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f2e8"/>
      <stop offset="45%" stop-color="#fffaf4"/>
      <stop offset="100%" stop-color="#eef4f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6d4c41" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.1"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1d2430; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: 0.3px; }
      .subtitle { font-size: 18px; fill: #5d6876; }
      .branch { fill: #ffffff; stroke: rgba(255,255,255,0.7); stroke-width: 2; }
      .branch-title { font-size: 24px; font-weight: 700; }
      .branch-note { font-size: 15px; fill: #5d6876; }
      .child { fill: #fffdfa; stroke: rgba(29,36,48,0.06); stroke-width: 1.5; }
      .child-text { font-size: 17px; font-weight: 600; }
      .child-sub { font-size: 14px; fill: #697586; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dot { stroke: #ffffff; stroke-width: 5; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <circle cx="160" cy="150" r="70" fill="#f4d7b6" opacity="0.28"/>
  <circle cx="1620" cy="140" r="96" fill="#dbece5" opacity="0.35"/>
  <circle cx="1690" cy="1010" r="120" fill="#f6ddcf" opacity="0.24"/>
  <circle cx="180" cy="1040" r="140" fill="#d9ebe7" opacity="0.28"/>
  <circle cx="910" cy="104" r="42" fill="#f8e8c9" opacity="0.45"/>

  <text x="900" y="72" text-anchor="middle" class="title">Mendoza IA - Mapa Mental do Fluxo</text>
  <text x="900" y="106" text-anchor="middle" class="subtitle">Webhook - Persistencia - Engine - Orquestrador - IA/Reservas - Resposta - Operacao</text>

  <path class="line" d="M760 525 C600 430, 490 360, 360 290" stroke="#d77b54" stroke-width="14" opacity="0.92"/>
  <path class="line" d="M742 595 C555 595, 430 595, 320 595" stroke="#d59e35" stroke-width="14" opacity="0.92"/>
  <path class="line" d="M760 675 C600 790, 500 865, 360 930" stroke="#4c9d88" stroke-width="14" opacity="0.92"/>
  <path class="line" d="M1040 525 C1200 430, 1320 340, 1450 275" stroke="#5d8fd8" stroke-width="14" opacity="0.92"/>
  <path class="line" d="M1058 600 C1225 600, 1330 595, 1488 590" stroke="#8b6cc9" stroke-width="14" opacity="0.92"/>
  <path class="line" d="M1040 675 C1195 790, 1290 860, 1445 930" stroke="#d85e7d" stroke-width="14" opacity="0.92"/>

  <circle cx="360" cy="290" r="10" fill="#d77b54" class="dot"/>
  <circle cx="320" cy="595" r="10" fill="#d59e35" class="dot"/>
  <circle cx="360" cy="930" r="10" fill="#4c9d88" class="dot"/>
  <circle cx="1450" cy="275" r="10" fill="#5d8fd8" class="dot"/>
  <circle cx="1488" cy="590" r="10" fill="#8b6cc9" class="dot"/>
  <circle cx="1445" cy="930" r="10" fill="#d85e7d" class="dot"/>

  <g filter="url(#shadow)">
    <rect x="742" y="470" width="316" height="258" rx="38" fill="#fffdfa" stroke="#f0e4d6" stroke-width="3"/>
    <rect x="773" y="501" width="254" height="84" rx="24" fill="#1e5a58"/>
    <text x="900" y="553" text-anchor="middle" font-size="34" font-weight="700" fill="#fff8ee">Fluxo Mendoza IA</text>
    <text x="900" y="612" text-anchor="middle" font-size="20" font-weight="600" fill="#31404a">Nucleo de atendimento conversacional</text>
    <text x="900" y="646" text-anchor="middle" font-size="18" fill="#5d6876">multi-tenant, CRM, automacao e IA</text>
    <text x="900" y="690" text-anchor="middle" font-size="18" fill="#5d6876">estado principal em Postgres + Redis</text>
  </g>

  <g filter="url(#soft)">
    <rect x="130" y="180" width="460" height="210" rx="30" class="branch"/>
    <text x="170" y="232" class="branch-title" fill="#b5552c">1. Canais de Entrada</text>
    <text x="170" y="262" class="branch-note">As conversas chegam por webhooks e viram eventos de dominio.</text>

    <rect x="170" y="290" width="172" height="70" rx="18" class="child"/>
    <text x="256" y="320" text-anchor="middle" class="child-text">WhatsApp</text>
    <text x="256" y="343" text-anchor="middle" class="child-sub">Evolution API + sessao</text>

    <rect x="360" y="290" width="190" height="70" rx="18" class="child"/>
    <text x="455" y="320" text-anchor="middle" class="child-text">Meta Channels</text>
    <text x="455" y="343" text-anchor="middle" class="child-sub">Instagram e Messenger</text>

    <line x1="342" y1="325" x2="360" y2="325" stroke="#d77b54" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g filter="url(#soft)">
    <rect x="95" y="485" width="500" height="220" rx="30" class="branch"/>
    <text x="140" y="537" class="branch-title" fill="#b57f16">2. Persistencia Base</text>
    <text x="140" y="567" class="branch-note">Cada mensagem vira registro e atualiza a conversa do tenant.</text>

    <rect x="135" y="596" width="205" height="76" rx="18" class="child"/>
    <text x="238" y="626" text-anchor="middle" class="child-text">Contacts / Conversations</text>
    <text x="238" y="649" text-anchor="middle" class="child-sub">telefone, tags, estado, preview</text>

    <rect x="360" y="596" width="195" height="76" rx="18" class="child"/>
    <text x="457" y="626" text-anchor="middle" class="child-text">Messages</text>
    <text x="457" y="649" text-anchor="middle" class="child-sub">inbound, outbound, processedAt</text>

    <rect x="190" y="690" width="270" height="76" rx="18" class="child"/>
    <text x="325" y="720" text-anchor="middle" class="child-text">Organizations.settings</text>
    <text x="325" y="743" text-anchor="middle" class="child-sub">bot, reservas, billing, canais, regras</text>
  </g>

  <g filter="url(#soft)">
    <rect x="118" y="820" width="492" height="220" rx="30" class="branch"/>
    <text x="162" y="872" class="branch-title" fill="#2f7f69">3. Memoria e Aprendizado</text>
    <text x="162" y="902" class="branch-note">Contexto curto em Redis e conhecimento duravel no banco.</text>

    <rect x="156" y="930" width="188" height="74" rx="18" class="child"/>
    <text x="250" y="960" text-anchor="middle" class="child-text">Redis State</text>
    <text x="250" y="983" text-anchor="middle" class="child-sub">locks, debounce, perfil, fila humana</text>

    <rect x="365" y="930" width="205" height="74" rx="18" class="child"/>
    <text x="468" y="960" text-anchor="middle" class="child-text">Memories / FAQ / Training</text>
    <text x="468" y="983" text-anchor="middle" class="child-sub">memorias, exemplos e feedback</text>

    <rect x="214" y="1020" width="258" height="74" rx="18" class="child"/>
    <text x="343" y="1050" text-anchor="middle" class="child-text">Crons de melhoria continua</text>
    <text x="343" y="1073" text-anchor="middle" class="child-sub">follow-up, gerar FAQ, cleanup</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1210" y="158" width="470" height="230" rx="30" class="branch"/>
    <text x="1254" y="210" class="branch-title" fill="#3d72c8">4. Debounce e Processamento</text>
    <text x="1254" y="240" class="branch-note">Evita respostas prematuras e sincroniza o trabalho distribuido.</text>

    <rect x="1250" y="270" width="185" height="78" rx="18" class="child"/>
    <text x="1342" y="300" text-anchor="middle" class="child-text">Webhook Router</text>
    <text x="1342" y="323" text-anchor="middle" class="child-sub">normaliza eventos e identifica fluxo</text>

    <rect x="1450" y="270" width="190" height="78" rx="18" class="child"/>
    <text x="1545" y="300" text-anchor="middle" class="child-text">Redis + QStash</text>
    <text x="1545" y="323" text-anchor="middle" class="child-sub">debounce, cancelamento e lock</text>

    <rect x="1316" y="364" width="250" height="78" rx="18" class="child"/>
    <text x="1441" y="394" text-anchor="middle" class="child-text">/api/process-conversation</text>
    <text x="1441" y="417" text-anchor="middle" class="child-sub">revalida typing/flood e executa</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1195" y="470" width="510" height="260" rx="30" class="branch"/>
    <text x="1240" y="522" class="branch-title" fill="#6f50b2">5. Engine e Orquestrador</text>
    <text x="1240" y="552" class="branch-note">Aqui mora a inteligencia operacional do produto.</text>

    <rect x="1235" y="584" width="190" height="78" rx="18" class="child"/>
    <text x="1330" y="614" text-anchor="middle" class="child-text">Conversation Engine</text>
    <text x="1330" y="637" text-anchor="middle" class="child-sub">urgencia, buffers, automacoes</text>

    <rect x="1443" y="584" width="220" height="78" rx="18" class="child"/>
    <text x="1553" y="614" text-anchor="middle" class="child-text">Conversation Orchestrator</text>
    <text x="1553" y="637" text-anchor="middle" class="child-sub">regras, FAQ, fallback IA, handoff</text>

    <rect x="1276" y="678" width="350" height="78" rx="18" class="child"/>
    <text x="1451" y="708" text-anchor="middle" class="child-text">Segmentos: mecanica, restaurante e geral</text>
    <text x="1451" y="731" text-anchor="middle" class="child-sub">servicos, catalogo, reservas, atendimento humano</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1190" y="820" width="520" height="240" rx="30" class="branch"/>
    <text x="1235" y="872" class="branch-title" fill="#c74465">6. Saida e Operacao</text>
    <text x="1235" y="902" class="branch-note">A resposta final volta ao canal e o time opera pelo dashboard.</text>

    <rect x="1230" y="930" width="194" height="78" rx="18" class="child"/>
    <text x="1327" y="960" text-anchor="middle" class="child-text">Envio ao canal</text>
    <text x="1327" y="983" text-anchor="middle" class="child-sub">WhatsApp, Instagram, Messenger</text>

    <rect x="1442" y="930" width="226" height="78" rx="18" class="child"/>
    <text x="1555" y="960" text-anchor="middle" class="child-text">Dashboard operacional</text>
    <text x="1555" y="983" text-anchor="middle" class="child-sub">chat, AI controls, reservas, contatos</text>

    <rect x="1312" y="1024" width="270" height="78" rx="18" class="child"/>
    <text x="1447" y="1054" text-anchor="middle" class="child-text">Logs, billing e admin da plataforma</text>
    <text x="1447" y="1077" text-anchor="middle" class="child-sub">orchestration logs, paywall, usuarios</text>
  </g>

  <g opacity="0.74">
    <path class="line" d="M256 360 C240 410, 220 460, 220 520" stroke="#d77b54" stroke-width="4"/>
    <path class="line" d="M455 360 C470 420, 478 480, 468 540" stroke="#d77b54" stroke-width="4"/>
    <path class="line" d="M320 705 C312 760, 312 815, 320 865" stroke="#d59e35" stroke-width="4"/>
    <path class="line" d="M1440 442 C1445 485, 1448 525, 1451 578" stroke="#5d8fd8" stroke-width="4"/>
    <path class="line" d="M1451 758 C1448 810, 1447 860, 1447 918" stroke="#8b6cc9" stroke-width="4"/>
  </g>

  <g opacity="0.9">
    <text x="900" y="1140" text-anchor="middle" font-size="16" fill="#6f7886">
      Fluxo real do codigo: webhook - persistencia - debounce - processConversation - engine - orchestrator - executor - canal
    </text>
  </g>
</svg>
